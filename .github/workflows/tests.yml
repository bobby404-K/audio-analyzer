name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest nbconvert jupyter

      - name: Run Python tests
        shell: bash
        run: |
          if find . -type f \( -name "test_*.py" -o -name "*_test.py" \) \
            -not -path "./.git/*" | grep -q .; then
            pytest
          else
            echo "No Python tests found — skipping."
          fi

      - name: Test Jupyter notebooks
        shell: bash
        run: |
          notebooks=$(find . -type f -name "*.ipynb" \
            -not -path "./.git/*" \
            -not -path "./.venv/*" \
            -not -path "./venv/*")

          if [ -z "$notebooks" ]; then
            echo "No Jupyter notebooks found — skipping."
            exit 0
          fi

          while IFS= read -r notebook; do
            echo "Testing: $notebook"

            jupyter nbconvert \
              --to notebook \
              --execute "$notebook" \
              --ExecutePreprocessor.timeout=300 \
              --output /tmp/executed.ipynb
          done <<< "$notebooks"


  javascript:
    name: JavaScript / TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found — skipping."
            exit 0
          fi

      - name: Run JavaScript / TypeScript checks
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm test --if-present
            npm run lint --if-present
            npm run build --if-present
          else
            echo "No JavaScript/TypeScript project — skipping."
          fi
